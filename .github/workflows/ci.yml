name: Rust CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v2.9.2
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v5.0.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features
      - run: cargo test --locked
      - run: cargo build --release --locked

  msrv:
    name: MSRV compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v2.9.2
        with:
          toolchain: 1.91
      - uses: Swatinem/rust-cache@v5.0.1
        with:
          key: msrv
      - run: cargo test --locked
      - run: cargo build --release --locked
