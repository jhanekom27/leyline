version: "3"

vars:
  MDBOOK_VERSION: "0.5.4"
  MDBOOK: "{{.ROOT_DIR}}/.tools/bin/mdbook"
  CARGO_DIST_VERSION: "0.32.0"
  PACKAGE_VERSION:
    sh: 'package_id="$(cargo pkgid)"; printf "%s" "${package_id##*#}"'
  RELEASE_TAG: "v{{.PACKAGE_VERSION}}"
  DIST_DIR: "{{.ROOT_DIR}}/target/distrib"

tasks:
  docs:install:
    desc: Install the pinned mdBook release locally
    status:
      - '"{{.MDBOOK}}" --version | grep -Fq "v{{.MDBOOK_VERSION}}"'
      - '"{{.MDBOOK}}" serve --help >/dev/null'
    cmds:
      - >-
        cargo install mdbook --locked --force --version "{{.MDBOOK_VERSION}}"
        --root "{{.ROOT_DIR}}/.tools"

  docs:build:
    desc: Build the static documentation site
    deps:
      - docs:install
    cmds:
      - '"{{.MDBOOK}}" build guide'

  docs:test:
    desc: Test documentation examples
    deps:
      - docs:install
    cmds:
      - '"{{.MDBOOK}}" test guide'

  docs:serve:
    desc: Serve the guide locally with live reload
    deps:
      - docs:install
    cmds:
      - '"{{.MDBOOK}}" serve --open guide'
  docs:demo:
    desc: Render the reproducible two-peer leyline GIF
    preconditions:
      - sh: command -v vhs >/dev/null
        msg: "Install VHS first: brew install vhs"
      - sh: command -v tmux >/dev/null
        msg: "Install tmux first: brew install tmux"
    cmds:
      - cargo build --release
      - bash docs/demo.sh render
  docs:file-demo:
    desc: Render the reproducible two-peer file-sharing GIF
    preconditions:
      - sh: command -v vhs >/dev/null
        msg: "Install VHS first: brew install vhs"
      - sh: command -v tmux >/dev/null
        msg: "Install tmux first: brew install tmux"
    cmds:
      - cargo build --release
      - bash docs/file-demo.sh render


  release:preflight:
    internal: true
    desc: Verify that the local checkout and release tools are ready
    preconditions:
      - sh: command -v dist >/dev/null
        msg: "Install cargo-dist {{.CARGO_DIST_VERSION}} first: cargo install cargo-dist --version {{.CARGO_DIST_VERSION}} --locked"
      - sh: 'test "$(dist --version)" = "cargo-dist {{.CARGO_DIST_VERSION}}"'
        msg: "Install cargo-dist {{.CARGO_DIST_VERSION}} to match dist-workspace.toml."
      - sh: command -v zig >/dev/null
        msg: "Install Zig first: https://ziglang.org/download/"
      - sh: command -v cargo-zigbuild >/dev/null
        msg: "Install cargo-zigbuild first: cargo install cargo-zigbuild --locked"
      - sh: command -v cargo-xwin >/dev/null
        msg: "Install cargo-xwin first: cargo install cargo-xwin --locked"
      - sh: 'test "$(git branch --show-current)" = main'
        msg: "Validate release candidates from the main branch."
      - sh: 'test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"'
        msg: "Push the current main commit before validating a release candidate."
      - sh: 'git diff --quiet && git diff --cached --quiet && test -z "$(git ls-files --others --exclude-standard)"'
        msg: "Commit or stash all changes before validating a release candidate."
      - sh: '! git rev-parse -q --verify "refs/tags/{{.RELEASE_TAG}}" >/dev/null'
        msg: "The local tag {{.RELEASE_TAG}} already exists."
      - sh: '! git ls-remote --exit-code --tags origin "refs/tags/{{.RELEASE_TAG}}" >/dev/null 2>&1'
        msg: "The remote tag {{.RELEASE_TAG}} already exists."

  release:plan:
    internal: true
    desc: Validate the planned release artifacts
    cmds:
      - dist plan --tag "{{.RELEASE_TAG}}"

  release:verify:
    internal: true
    desc: Verify release archives and checksums
    cmds:
      - |
        for asset in \
          "{{.DIST_DIR}}/leyline-aarch64-apple-darwin.tar.xz" \
          "{{.DIST_DIR}}/leyline-aarch64-apple-darwin.tar.xz.sha256" \
          "{{.DIST_DIR}}/leyline-x86_64-apple-darwin.tar.xz" \
          "{{.DIST_DIR}}/leyline-x86_64-apple-darwin.tar.xz.sha256" \
          "{{.DIST_DIR}}/leyline-x86_64-unknown-linux-gnu.tar.xz" \
          "{{.DIST_DIR}}/leyline-x86_64-unknown-linux-gnu.tar.xz.sha256" \
          "{{.DIST_DIR}}/leyline-x86_64-pc-windows-msvc.zip" \
          "{{.DIST_DIR}}/leyline-x86_64-pc-windows-msvc.zip.sha256" \
          "{{.DIST_DIR}}/sha256.sum"
        do
          test -f "$asset"
        done
      - |
        for checksum in \
          "{{.DIST_DIR}}/leyline-aarch64-apple-darwin.tar.xz.sha256" \
          "{{.DIST_DIR}}/leyline-x86_64-apple-darwin.tar.xz.sha256" \
          "{{.DIST_DIR}}/leyline-x86_64-unknown-linux-gnu.tar.xz.sha256" \
          "{{.DIST_DIR}}/leyline-x86_64-pc-windows-msvc.zip.sha256"
        do
          archive="${checksum%.sha256}"
          IFS=' ' read -r expected _ < "$checksum"
          actual="$(shasum -a 256 "$archive")"
          actual="${actual%% *}"
          test "$actual" = "$expected"
        done

  release:smoke:
    internal: true
    desc: Run the native shippable build and verify its version
    cmds:
      - |
        actual="$(cargo run --quiet --profile dist -- --version)"
        case "$actual" in
          "leyline {{.PACKAGE_VERSION}} "*) ;;
          *)
            printf 'expected Leyline {{.PACKAGE_VERSION}}, got: %s\n' "$actual"
            exit 1
            ;;
        esac

  release:build:
    desc: Build and verify release artifacts without publishing
    cmds:
      - dist build --artifacts=local --tag "{{.RELEASE_TAG}}"
      - dist build --artifacts=global --tag "{{.RELEASE_TAG}}"
      - task: release:verify
      - task: release:smoke


  release:
    desc: Build and verify the current Leyline version before creating its release tag
    prompt: "Verify Leyline {{.PACKAGE_VERSION}} before creating {{.RELEASE_TAG}}?"
    cmds:
      - task: release:preflight
      - task: release:plan
      - task: release:build

  git:tag:
    desc: Create and push the verified release tag for the current main commit
    prompt: "Create and push {{.RELEASE_TAG}} from the current main commit?"
    cmds:
      - task: release
      - 'git tag -a "{{.RELEASE_TAG}}" -m "release: {{.RELEASE_TAG}}"'
      - git push origin "refs/tags/{{.RELEASE_TAG}}"
